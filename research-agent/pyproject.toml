[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "research-backend==0.1.0", "openai>=1.65,<3", "pdfplumber>=0.11,<1",
  "Pillow>=11,<13", "langgraph>=1.0,<2", "langsmith>=0.3,<1",
]

[tool.setuptools.packages.find]
include = ["research_agent*", "evaluation*"]

[tool.uv.sources]
research-backend = { workspace = true }
