[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "python-dotenv>=1.0,<2", "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pgvector>=0.3.6,<1",
  "argon2-cffi>=23.1,<26", "PyJWT>=2.10,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "celery[redis]>=5.4,<6", "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["research_backend*", "research_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
